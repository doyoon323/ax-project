[project]
name = "issue-to-pr-agent"
version = "0.1.0"
description = "A guarded, three-turn GitHub issue-to-draft-PR agent"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "litellm>=1.91.4,<1.92",
    "pydantic-settings>=2.6,<3",
    "requests>=2.32,<3",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "coverage>=7,<8",
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/issue_to_pr_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
branch = true
source = ["issue_to_pr_agent"]

[tool.coverage.report]
fail_under = 70
show_missing = true
