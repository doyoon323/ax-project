[project]
name = "ax-project"
version = "0.1.0"
description = "Evidence-backed Python code impact analysis agent"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=0.3.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0",
    "langgraph>=0.2",
]

[project.scripts]
code-impact = "code_impact.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_impact"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
